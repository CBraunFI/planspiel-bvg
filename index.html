    <label class="ck"><input id="s-callfail" type="checkbox" ${s.callFail?'checked':''}> Call-Fehlschlag kostet Vertrauen</label>
    <label class="ck"><input id="s-critonce" type="checkbox" ${s.critOnce?'checked':''}> Glanzwurf nur 1×/Runde</label>
    <label class="ck"><input id="s-turntimer" type="checkbox" ${s.turnTimer?'checked':''}> Zugtimer</label>
    <label class="ck"><input id="s-strengths" type="checkbox" ${s.strengths?'checked':''}> Stärkenkarten</label></div>`;
}
function readSettings(){
  const g=id=>$(id);const s={...DEFAULT_SETTINGS,...setupSettings};if(!g('s-dice'))return s;
  s.mode=g('s-mode').value;s.dice=g('s-dice').value;s.chips=+g('s-chips').value;s.rounds=+g('s-rounds').value;s.standingStart=+g('s-standing').value;s.standingMax=+g('s-standingmax').value;s.projectTarget=+g('s-project').value;
  s.diffMin=+g('s-diffmin').value;s.diffMax=+g('s-diffmax').value;s.turnSec=+g('s-turnsec').value;s.timeoutMode=g('s-timeout').value;s.turnTimer=g('s-turntimer').checked;s.strengths=g('s-strengths').checked;
  s.events=g('s-events').value||'2,3,3,4';s.pd=g('s-pd').value||'4,5,7';s.escPen=+g('s-escpen').value||1;s.bereit=+g('s-bereit').value||5;s.helpB=+g('s-helpb').value||1;s.callFail=g('s-callfail').checked;s.critOnce=g('s-critonce').checked;s.wagnisPlus=+g('s-wagplus').value||0;s.puffer=g('s-puffer').checked;s.overtime=g('s-overtime').checked;s.stillstand=g('s-stillstand').checked;s.prio=g('s-prio').checked;return s;
}
function bindDice(){$('s-dice')?.addEventListener('change',e=>{if(e.target.value==='2d6'){$('s-diffmin').value=7;$('s-diffmax').value=9}else{$('s-diffmin').value=4;$('s-diffmax').value=6}})}
function simHtml(){return `<details><summary>Balancing: Auto-Sim</summary><div class="row" style="margin-top:8px"><label class="muted">Partien <input id="sim-n" type="number" value="500" min="10" max="5000" style="width:80px"></label>
  <select id="sim-strat"><option value="sicher">Dilemma: immer der sichere, teure Weg</option><option value="billig">Dilemma: immer der billige Weg, Nebenwirkungen egal</option><option value="wagnis">Dilemma: immer Wagnis</option><option value="mix">Dilemma: sicher wenn möglich, sonst billig</option><option value="klug">Dilemma: klug (Wagnis bei ≥ 67 %, billig wenn verkraftbar, sonst sicher)</option><option value="coop">Würfel: kooperativ</option><option value="solo">Würfel: Alleingänge</option><option value="project">Würfel: Projektfokus</option></select><button class="primary" id="btn-sim">Simulieren</button></div><div id="simres" class="tiles sim"></div></details>`}
function bindSim(){$('btn-sim')?.addEventListener('click',()=>{const s=readSettings();const strat=$('sim-strat').value;s.mode=['coop','solo','project'].includes(strat)?'wuerfel':'dilemma';const r=simulate(Math.max(10,Math.min(5000,+$('sim-n').value||500)),strat,s);const pct=x=>Math.round(100*x/r.games)+'%';
  $('simres').innerHTML=`<div class="tile"><div class="v">${pct(r.won)}</div><div class="k">Teamziel</div></div><div class="tile"><div class="v">${pct(r.projectReached)}</div><div class="k">Projekt voll</div></div><div class="tile"><div class="v">${pct(r.lostStanding)}</div><div class="k">Standing 0</div></div><div class="tile"><div class="v num">${r.avgProject.toFixed(1)}</div><div class="k">Ø Projekt</div></div><div class="tile"><div class="v num">${r.avgStanding.toFixed(1)}</div><div class="k">Ø Standing</div></div><div class="tile"><div class="v num">${(r.follow/r.games).toFixed(1)}</div><div class="k">Folgekarten/Partie</div></div><div class="tile"><div class="v num">${(r.rolls/r.games).toFixed(0)}</div><div class="k">Würfe/Partie</div></div>`})}
function showSetup(){
  const ov=$('ov');ov.hidden=false;$('app').style.visibility='hidden';
  ov.innerHTML=`<div class="box"><h1>Planspiel Hot-Seat</h1><div class="muted">Vier Rollen, eine Spielleitung, ein Bildschirm. Figur wählen, Namen eintragen, Stärke wählen, los. Regelstand v2.5.</div>
    <div class="scen">${esc(SCENARIO.intro)}</div>
    <div class="seats">${ROLES.map((r,i)=>{const sp=setupPlayers[i];sp.portrait=sp.portrait||PORTRAITS[i].id;return `<div class="seat" style="--pc:var(${r.color})"><div class="r">${r.role}</div>
      <div class="pick"><div class="pf" id="pf-${i}">${portraitSVG(PORT(sp.portrait),150)}</div><div><input data-n="${i}" value="${esc(sp.name)}" aria-label="Name" style="width:120px"><div class="muted" style="font-size:12px" id="pl-${i}">${esc(PORT(sp.portrait).line)}</div></div></div>
      <div class="pgrid" data-pg="${i}">${PORTRAITS.map(pt=>`<div class="pp ${sp.portrait===pt.id?'on':''}" data-pid="${pt.id}" title="${esc(pt.name)}: ${esc(pt.line)}">${portraitSVG(pt,44)}</div>`).join('')}</div>
      <select data-s="${i}" aria-label="Stärke">${Object.entries(STRENGTHS).map(([k,v])=>`<option value="${k}" ${sp.strength===k?'selected':''}>${v.name}</option>`).join('')}</select>
      <div class="muted" style="font-size:12px" id="sd-${i}">${STRENGTHS[sp.strength].effect}</div></div>`}).join('')}</div>
    <details><summary>Regeln anpassen</summary><div style="margin-top:8px">${settingsHtml({...DEFAULT_SETTINGS,...setupSettings})}</div></details>${simHtml()}
    <div class="row"><button class="big primary" id="btn-start">Spiel starten</button>${hasSaved()?'<button id="btn-resume">Spielstand fortsetzen</button>':''}</div></div>`;
  ov.querySelectorAll('[data-n]').forEach(i=>i.addEventListener('input',e=>setupPlayers[+i.dataset.n].name=e.target.value));
  ov.querySelectorAll('.pgrid').forEach(g=>g.querySelectorAll('.pp').forEach(pp=>pp.addEventListener('click',()=>{const i=+g.dataset.pg;const pt=PORT(pp.dataset.pid);setupPlayers[i].portrait=pt.id;if(!ov.querySelector(`[data-n="${i}"]`).value||PORTRAITS.some(x=>x.name===ov.querySelector(`[data-n="${i}"]`).value)){setupPlayers[i].name=pt.name;ov.querySelector(`[data-n="${i}"]`).value=pt.name}$('pf-'+i).innerHTML=portraitSVG(pt,150);$('pl-'+i).textContent=pt.line;g.querySelectorAll('.pp').forEach(x=>x.classList.toggle('on',x.dataset.pid===pt.id))})));
  ov.querySelectorAll('[data-s]').forEach(i=>i.addEventListener('change',e=>{setupPlayers[+i.dataset.s].strength=e.target.value;$('sd-'+i.dataset.s).textContent=STRENGTHS[e.target.value].effect}));
  bindDice();bindSim();
  $('btn-start').addEventListener('click',startGame);
  $('btn-resume')?.addEventListener('click',()=>{try{S=JSON.parse(localStorage.getItem('planspiel-state'));migrate();UI.call=UI.call||{q:CALL_QUESTIONS[0],done:false};closeOverlay();if(timed()&&S.turn!==null)startTurnTimer();render()}catch(e){}});
}
function showSettings(){
  const ov=$('ov');ov.hidden=false;
  ov.innerHTML=`<div class="box"><h1>Einstellungen</h1><div class="muted">Regeländerungen gelten ab dem nächsten Spiel. Regelstand v2.4.</div>${settingsHtml({...DEFAULT_SETTINGS,...(S?S.settings:setupSettings)})}${simHtml()}
    <div class="row"><button class="primary" id="btn-apply">Übernehmen</button><button id="btn-copy">Protokoll kopieren</button><button id="btn-new">Neues Spiel</button><button class="ghost" id="btn-close">Schließen</button></div></div>`;
  bindDice();bindSim();
  $('btn-apply').addEventListener('click',()=>{setupSettings=readSettings();closeOverlay()});
  $('btn-copy').addEventListener('click',e=>copyLog(e.target));
  $('btn-new').addEventListener('click',()=>{setupSettings=readSettings();resetGame()});
  $('btn-close').addEventListener('click',closeOverlay);
  ov.addEventListener('click',e=>{if(e.target===ov)closeOverlay()},{once:true});
}
function closeOverlay(){$('ov').hidden=true;$('app').style.visibility=''}
function hasSaved(){try{const s=JSON.parse(localStorage.getItem('planspiel-state')||'null');return s&&!s.over&&s.scheduled}catch(e){return false}}
function migrate(){if(S){S.settings={...DEFAULT_SETTINGS,...S.settings};S.puffer=S.puffer||0;S.players.forEach((p,i)=>{p.portrait=p.portrait||PORTRAITS[i].id;p.erschoepfung=p.erschoepfung||0;p.debt=p.debt||0});S.scheduled=S.scheduled||[];S.nachbarDebt=S.nachbarDebt||0;S.stats.wagnis=S.stats.wagnis||0;S.stats.sicher=S.stats.sicher||0;if(S.restructuring&&S.restructuringRound==null)S.restructuringRound=S.round;S.open.forEach(e=>{if(!e.opts)e.opts=CARD(e.id)?.opts||[]});S.deck.forEach(e=>{if(!e.opts)e.opts=CARD(e.id)?.opts||[]})}}
function startGame(){
  setupSettings=readSettings();S=newState(setupSettings,setupPlayers);
  UI={...UI,act:null,lastRoll:null,peek:null,timerId:null,turnEnd:null,call:{q:CALL_QUESTIONS[0],done:false},refl:['',''],flashQ:[],flashBusy:false,secretOpen:false,focus:null};
  logRound(1);logNarr(SCENARIO.intro);
  logSys(`Am Tisch: ${S.players.map(p=>`${p.name} (${p.role}${S.settings.strengths?', '+STRENGTHS[p.strength].name:''})`).join(', ')}. Modus: ${dil()?'Dilemma':'Würfel'}.`);logPhase('Ereignis');
  closeOverlay();flash('Runde 1','round',2200);render();
}
function resetGame(){stopTurnTimer();if(S){setupPlayers=S.players.map(p=>({name:p.name,strength:p.strength,portrait:p.portrait}))}S=null;try{localStorage.removeItem('planspiel-state')}catch(e){}render()}
function copyLog(btn){
  if(!S)return;const txt=S.log.map(l=>l.k==='round'?`\n=== ${l.t} ===`:l.k==='phase'?`--- ${l.t} ---`:l.t).join('\n');
  const done=()=>{const t=btn.textContent;btn.textContent='Kopiert';setTimeout(()=>btn.textContent=t,1500)};
  const fb=()=>{const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done()}catch(e){}document.body.removeChild(ta)};
  if(navigator.clipboard?.writeText)navigator.clipboard.writeText(txt).then(done).catch(fb);else fb();
}

// ---------- Auto-Sim (beide Modi) ----------
function simulate(n,strat,s){
  const res={games:n,won:0,lostStanding:0,avgProject:0,avgStanding:0,rolls:0,ones:0,succ:0,fails:0,projectReached:0,follow:0};
  const tw=s.dice==='2d6';const d6=()=>1+Math.floor(Math.random()*6);
  const rollFn=()=>{const d=tw?[d6(),d6()]:[d6()];return{t:d.reduce((a,b)=>a+b,0),f:d.every(x=>x===1),c:d.every(x=>x===6)}};
  const thr=tw?7:4;const ev=String(s.events).split(',').map(x=>+x||1);const pdA=String(s.pd).split(',').map(x=>+x);const pd=pr=>(pdA[pr<3?0:pr<6?1:2]||[4,5,7][pr<3?0:pr<6?1:2])+(tw?3:0);const bereit=s.bereit+(tw?3:0);
  const dm=s.mode==='dilemma';const wp=dm?(s.wagnisPlus||0):0;
  for(let g=0;g<n;g++){
    let deck=buildDeck();mapDifficulty(deck,s);let discard=[],open=[],standing=s.standingStart,project=0,restr=false,sched=[],debt=0;
    const draw=(card)=>{let e;if(card){e=mkCard(card);mapDifficulty([e],s);res.follow++}else{if(!deck.length){deck=shuffle(discard);discard=[]}if(!deck.length)return;e=deck.shift()}if(e.id===8)e.diff+=debt;open.push(e)};
    const pl=ROLES.map(r=>({...r,chips:s.chips,extra:0}));
    const setSt=v=>{standing=Math.max(0,Math.min(s.standingMax,v))};const setPr=v=>{project=Math.max(0,Math.min(s.projectTarget,v))};
    for(let round=1;round<=s.rounds;round++){
      for(let k=0;k<(ev[Math.min(round,ev.length)-1]||1);k++)draw();
      sched.filter(x=>x.round<=round).forEach(x=>draw(CARD(x.card)));sched=sched.filter(x=>x.round>round);
      const heavy=open.filter(e=>e.type!=='Chance').length;const pAtStart=project;
      pl.forEach(p=>{p.side=strat==='project'?(p.focus==='Projekt'||heavy<3?'project':'standing'):(p.focus==='Projekt'?'project':p.focus==='Team'&&heavy<2?'project':'standing');p.noPair=false;p.done=false});
      let critUsed=false,acted=true;
      const crit=()=>{if(!s.critOnce||!critUsed){setSt(standing+1);critUsed=true}};
      const after=r=>{if(r.c)crit();if(r.f){res.ones++;draw()}};
      const applyFx=(p,o,e)=>{if(o.standing)setSt(standing+o.standing);if(o.project)setPr(project+o.project);if(o.chipsAll)pl.forEach(x=>x.chips+=o.chipsAll);if(o.later)sched.push({round:round+o.later.delay,card:o.later.card});if(o.nachbar){debt++;const c8=open.find(x=>x.id===8);if(c8)c8.diff++;if(!deck.some(x=>x.id===8)&&!c8)sched.push({round:round+1,card:109})}if(o.noPair&&p.strength!=='naehe'){const t=pl.find(x=>x.key===o.noPair);if(t)t.noPair=true}if(o.endRound)p.done=true;if(o.nextChips)p.extra+=o.nextChips;if(o.escalateNow&&e){e.diff++;setSt(standing-(s.escPen||1))}if(o.resolve&&e&&open.includes(e)){open=open.filter(x=>x!==e);if(e.id<100)discard.push(e)}};
      while(acted){acted=false;
        for(const p of pl){
          if(p.chips<1||p.done)continue;
          const matchCard=open.find(e=>FOCUS_MATCH[p.focus].includes(e.type)||(p.abilityKey==='standby'&&e.type==='Störung'));
          const target=p.side==='standing'?(matchCard||open[0]||null):null;
          const helper=()=>{const h=pl.find(x=>x!==p&&x.chips>0&&x.side===p.side&&!x.noPair);return h};
          if(dm){
            if(p.side==='standing'&&!target){p.chips--;acted=true;const r=rollFn();res.rolls++;if(r.t>=bereit)setSt(standing+1);after(r);continue}
            const e=target;const list=e?e.opts:PROJECT_OPTS.map(x=>({...x,chips:x.id==='g'&&project>=6?3:x.chips}));
            const cost=o=>o.chips||1;const payerOf=o=>o.payer&&o.payer!==p.key?pl.find(x=>x.key===o.payer):p;
            const afford=o=>{const py=payerOf(o);if(py!==p)return py.chips>=cost(o);const h=helper();return p.chips+(h&&cost(o)>=2?1:0)>=cost(o)};
            const det=list.filter(o=>!o.roll&&afford(o)),wag=list.filter(o=>o.roll&&afford(o));
            let o=null;
            if(strat==='sicher'){o=det.filter(x=>!x.later&&!x.nachbar&&!x.standing&&!(x.project<0)).sort((a,b)=>cost(b)-cost(a))[0]||det.sort((a,b)=>cost(b)-cost(a))[0]||wag[0]}
            else if(strat==='billig'){o=det.sort((a,b)=>cost(a)-cost(b))[0]||wag[0]}
            else if(strat==='wagnis'){o=wag[0]||det[0]}
            else if(strat==='klug'){
              const wg=wag[0];const wd=(e?e.diff:pd(project))+wp;const base=e?((FOCUS_MATCH[p.focus].includes(e.type)||(p.abilityKey==='standby'&&e.type==='Störung'))?2:0):(p.focus==='Projekt'?2:0)-open.filter(x=>x.type==='Störung').length;
              const need=wd-base-1;const ch=tw?0.5:Math.max(0,Math.min(1,(7-need)/6));
              const cheapOk=det.filter(x=>cost(x)===1&&!x.later&&!(x.project<0)&&(!x.standing||standing>=6)&&(!x.nachbar||debt===0)&&(payerOf(x)===p||!x.noPair||round>3));
              const safe=det.filter(x=>!x.later&&!x.nachbar&&!x.standing&&!(x.project<0)).sort((a,b)=>cost(b)-cost(a))[0];
              o=(wg&&ch>=0.67)?wg:(cheapOk[0]||safe||det.sort((a,b)=>cost(a)-cost(b))[0]||wg);
            }
            else{o=det.filter(x=>!x.later&&!x.nachbar&&!x.standing&&!(x.project<0)&&(payerOf(x)!==p||p.chips>=cost(x))).sort((a,b)=>cost(b)-cost(a))[0]||det.sort((a,b)=>cost(a)-cost(b))[0]||wag[0]}
            if(!o){p.done=true;continue}
            acted=true;const py=payerOf(o);let c=cost(o);
            if(py!==p){py.chips-=c}else{const h=helper();if(c>=2&&h&&p.chips<c){h.chips--;c--}else if(c>=2&&h&&strat!=='wagnis'){h.chips--;c--}p.chips-=c}
            if(o.roll){const diff=(e?e.diff:pd(project))+wp;const base=e?((FOCUS_MATCH[p.focus].includes(e.type)||(p.abilityKey==='standby'&&e.type==='Störung'))?2:0):(p.focus==='Projekt'?2:0)-open.filter(x=>x.type==='Störung').length;const r=rollFn();res.rolls++;const ok=r.t+base+1>=diff;if(ok){res.succ++;if(e)applyFx(p,o,e);else setPr(project+1)}else{res.fails++;if(e)applyFx(p,{...o.roll.fail},e)}after(r)}
            else applyFx(p,e?o:{...o,resolve:false},e);
            continue;
          }
          // Würfelmodus
          p.chips--;acted=true;let r,ok;
          if(p.side==='standing'&&!target){r=rollFn();res.rolls++;ok=r.t>=bereit;if(ok)setSt(standing+1)}
          else if(!target){let b=(p.focus==='Projekt'?2:0)-open.filter(e=>e.type==='Störung').length+(strat!=='solo'?1:0);const h=strat==='coop'?helper():null;if(h){h.chips--;b+=s.helpB||1}r=rollFn();res.rolls++;ok=r.t+b>=pd(project);if(ok){res.succ++;setPr(project+1)}else res.fails++}
          else{let b=((FOCUS_MATCH[p.focus].includes(target.type)||(p.abilityKey==='standby'&&target.type==='Störung'))?2:0)+(strat!=='solo'?1:0);const h=strat==='coop'?helper():null;if(h){h.chips--;b+=s.helpB||1}r=rollFn();res.rolls++;ok=r.t+b>=target.diff;
            if(ok){res.succ++;open=open.filter(e=>e!==target);discard.push(target);if(target.bonus){if(target.bonus.project)setPr(project+target.bonus.project);if(target.bonus.standing)setSt(standing+target.bonus.standing);if(target.bonus.chips)pl.forEach(x=>x.chips+=target.bonus.chips)}}else res.fails++}
          after(r);
        }}
      const prio=s.prio?(Math.random()<.5?'standing':'project'):null;const pen=(s.escPen||1)+(prio==='standing'?1:0);
      const keep=[];open.forEach(e=>{if(e.type==='Chance'){if(e.id<100)discard.push(e);return}setSt(standing-pen);e.diff++;keep.push(e)});open=keep;
      if(s.stillstand){if(!pl.some(p=>p.side==='project'))setPr(project-(prio==='project'?2:1));if(!pl.some(p=>p.side==='standing'))setSt(standing-(prio==='standing'?2:1))}
      if(prio==='project'&&project<=pAtStart)setSt(standing-1);
      const cr=rollFn();res.rolls++;if(cr.t>=thr)setSt(standing+1);else if(s.callFail)setSt(standing-1);
      if(standing<=0){if(!restr){restr=true;pl.forEach(p=>{p.chips=Math.max(0,s.chips-1+p.extra);p.extra=0});continue}else break}
      if(restr)break;pl.forEach(p=>{p.chips=Math.max(0,s.chips+p.extra);p.extra=0});
    }
    const won=project>=s.projectTarget&&standing>0;if(won)res.won++;if(standing<=0)res.lostStanding++;if(project>=s.projectTarget)res.projectReached++;res.avgProject+=project;res.avgStanding+=standing;
  }
  res.avgProject/=n;res.avgStanding/=n;return res;
}

// ---------- Start ----------
function boot(data){if(data&&data.S){S=data.S;migrate();UI={...UI,...(data.UI||{}),timerId:null,turnEnd:null,flashQ:[],flashBusy:false};if(timed()&&S.turn!==null)startTurnTimer()}render()}
try{window.claude?.hot?.snapshot?.(()=>({S,UI:{call:UI.call,refl:UI.refl}}))}catch(e){}
window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});
</script>
